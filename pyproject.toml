[project]
name = "langc-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amir ouni", email = "amirouni162@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "ollama>=0.6.3",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langc-course = "langc_course:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
